<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gemini 日報アシスタント</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
  <style>
    :root {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --success: #10b981;
      --success-hover: #059669;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
    
    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    @media (min-width: 640px) {
      body { padding: 24px; }
      .app-container {
        height: 88vh;
        border-radius: 24px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
      }
    }

    .header {
      padding: 18px 24px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-icon {
      width: 38px;
      height: 38px;
      background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
    }

    .brand-text h1 { font-size: 1rem; font-weight: 700; }
    .brand-text p { font-size: 0.725rem; color: var(--text-muted); }

    #chat-box {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #fafafa;
    }

    .message-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: slideUp 0.15s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-wrapper.user { align-self: flex-end; }
    .message-wrapper.bot { align-self: flex-start; }

    .message {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.925rem;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .user .message {
      background: var(--primary);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot .message {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .error .message { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }

    .typing-dots { display: inline-flex; gap: 4px; align-items: center; padding: 4px 8px; }
    .typing-dots span { width: 6px; height: 6px; background: #a1a1aa; border-radius: 50%; animation: blink 1.4s infinite fill-mode: both; }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0% { opacity: .2; } 20% { opacity: 1; } 100% { opacity: .2; } }

    .input-card {
      padding: 14px 18px;
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    textarea {
      width: 100%;
      height: 50px;
      padding: 12px;
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      resize: none;
      font-size: 0.925rem;
      outline: none;
      transition: all 0.15s;
    }

    textarea:focus { background: #fff; border-color: var(--primary); }

    .action-bar { display: flex; justify-content: space-between; align-items: center; }
    .hint { font-size: 0.7rem; color: var(--text-muted); }
    .btn-group { display: flex; gap: 8px; }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .send-btn { background: var(--primary); color: white; }
    .send-btn:hover { background: var(--primary-hover); }
    .save-btn { background: var(--success); color: white; }
    .save-btn:hover { background: var(--success-hover); }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="header">
      <div class="brand">
        <div class="brand-icon">✦</div>
        <div class="brand-text">
          <h1>Gemini 日報アシスタント</h1>
          <p>AI対話 ➔ スプレッドシート自動蓄積</p>
        </div>
      </div>
    </div>

    <div id="chat-box">
      <div class="message-wrapper bot">
        <div class="message">こんにちは！今日行った業務や困ったことなどを教えてください。</div>
      </div>
    </div>

    <div class="input-card">
      <textarea id="user-input" placeholder="メッセージを入力..."></textarea>
      <div class="action-bar">
        <div class="hint">Enterで送信 / Shift+Enterで改行</div>
        <div class="btn-group">
          <button class="send-btn" onclick="sendMessage()">送信 ↵</button>
          <button class="save-btn" onclick="saveReport()">今日の日報保存 ✨</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let log = [];

    document.getElementById('user-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage('user', text);
      log.push("ユーザー: " + text);
      input.value = '';

      const loadingWrapper = appendLoading();

      google.script.run
        .withSuccessHandler(function(reply) {
          loadingWrapper.className = 'message-wrapper bot';
          loadingWrapper.querySelector('.message').innerText = reply;
          log.push("Gemini: " + reply);
        })
        .withFailureHandler(function(error) {
          loadingWrapper.className = 'message-wrapper error';
          loadingWrapper.querySelector('.message').innerText = error.message;
        })
        .chatWithGemini(text);
    }

    function saveReport() {
      if (log.length === 0) return alert("会話内容がありません");
      const loadingWrapper = appendLoading("日報を生成・保存中...");

      google.script.run
        .withSuccessHandler(function(url) {
          loadingWrapper.className = 'message-wrapper bot';
          loadingWrapper.querySelector('.message').innerHTML = '✨ <b>保存完了！</b><br><a href="' + url + '" target="_blank" style="color:#4f46e5;font-weight:600;">スプレッドシートを開く ↗</a>';
        })
        .withFailureHandler(function(error) {
          loadingWrapper.className = 'message-wrapper error';
          loadingWrapper.querySelector('.message').innerText = error.message;
        })
        .saveDailyReport(log.join("\n"));
    }

    function appendMessage(sender, text) {
      const box = document.getElementById('chat-box');
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper ' + sender;
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerText = text;
      wrapper.appendChild(msg);
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return wrapper;
    }

    function appendLoading(text) {
      const box = document.getElementById('chat-box');
      const wrapper = document.createElement('div');
      wrapper.className = 'message-wrapper bot';
      const msg = document.createElement('div');
      msg.className = 'message';
      msg.innerHTML = text || '<div class="typing-dots"><span></span><span></span><span></span></div>';
      wrapper.appendChild(msg);
      box.appendChild(wrapper);
      box.scrollTop = box.scrollHeight;
      return wrapper;
    }
  </script>
</body>
</html>
